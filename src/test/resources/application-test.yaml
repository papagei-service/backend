ktor:
  application:
    modules:
      - space.zghoba.ApplicationKt.testingModule
  deployment:
    port: 8080

security:
  jwt:
    secret: "kK*hmb$*A*0rx$i!CoP6cNXGaQO*p4z5kjwk"
    issuer: "/v1/token"
    audience: "/v1"
    realm: "Access to the API"
    lifetime-ms: 300000  # 5 min
  sessions:
    lifetime-ms: 300000  # 5 min
  hashing:
    pepper: "fUSF*mHjOt7qTpHW$zvR3xaJyAInt9#sGFn0"
    algorithm: "SHA-512"
    salt-min-length: 32
    salt-max-length: 48

database:
  protocol: "jdbc:postgresql"
  host-with-path: $PPG_TEST_DB_HOST_WITH_PATH
  user: $PPG_TEST_DB_USER
  password: $PPG_TEST_DB_PASSWORD
  migrations-dir-path: "./migrations"