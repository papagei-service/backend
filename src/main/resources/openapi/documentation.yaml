openapi: "3.1.1"
info:
  title: "📑 Papagei API specification"
  description: "Public API for Papagei — spaced-repetition flashcards for language learning."
  version: "1.0.0"
tags:
  - name: Token
    description: "Endpoints to issue and refresh access tokens."
  - name: Account
    description: "User account creation, login, session management and profile."
  - name: Collections
    description: "Manage collections of flashcards (create, update, list, delete)."
  - name: Cards
    description: "CRUD operations for flashcards."
  - name: Collections-Cards
    description: "Add/remove cards to/from collections."
  - name: Examples
    description: "Manage usage examples for cards (create, update, list, delete)."
paths:
  /v1/token:
    get:
      tags:
        - Token
      summary: "Get a new non-strong token"
      description: |-
        Issue a new non-strong JWT.
        
        ***STRONG TOKEN authentication is required.**
      security:
        - bearerAuth: []
      responses:
        "401":
          description: "The passed token is not valid or has expired."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
              example:
                message: "The passed token is not valid or has expired."
        "200":
          description: "Returns a new access token."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Token"
  /v1/account/register:
    post:
      tags:
        - Account
      summary: "Register a new user."
      description: |-
        Register a new user using his/her email, displayed name, and password.
        
        ***NOT STRONG TOKEN authentication is required.**
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegistrationCredentials"
      responses:
        "400":
          description: "Invalid registration payload."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
              example:
                message: "The request body cannot be converted to a registration credentials"
        "401":
          description: |-
            The passed username is already taken or one of the fields is blank 
            or the passed token is not valid or has expired.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
              example:
                message: "The username \"Alice\" is already taken."
        "201":
          description: "The account created successfully."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
              example:
                message: "The account was created successfully."
  /v1/account/login:
    post:
      tags:
        - Account
      summary: "Authenticate user"
      description: "Authenticate by username and password. Session ID returned in Set-Cookie header on success."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginCredentials"
            example:
              username: "alice@example.com"
              password: "Str0ngP@ssw0rd"
      responses:
        "400":
          description: "Invalid login payload."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
              example:
                message: "Missing username or password."
        "404":
          description: "User not found."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
              example:
                message: "User not found."
        "401":
          description: "Incorrect password or invalid token."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
              example:
                message: "Incorrect credentials."
        "200":
          description: "Login successful — session cookie set."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
              example:
                message: "Login successful."
          headers:
            Set-Cookie:
              schema:
                type: string
                example: "session=ca6cde7...; Max-Age=300000000; Path=/; Secure; HttpOnly;"
  /v1/account/logout:
    post:
      tags:
        - Account
      summary: "Invalidate current session"
      description: "Terminate the user's current session; requires authentication."
      responses:
        "200":
          description: "Logout successful."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
              example:
                message: "Logged out."
        "401":
          description: "Invalid or missing auth token/session."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
              example:
                message: "Authentication required."
  /v1/account:
    get:
      tags:
        - Account
      summary: "Get authenticated user's profile"
      description: "Return account info inferred from current session."
      responses:
        "401":
          description: "Session not found or invalid."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
              example:
                message: "Session cookie missing or invalid."
        "200":
          description: "Account information."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
              example:
                id: 42
                display_name: "Alice"
                username: "alice@example.com"
    delete:
      tags:
        - Account
      summary: "Delete authenticated user's account"
      description: "Remove the account associated with the current session."
      responses:
        "204":
          description: "Account deleted."
  /v1/collections/{collection_id}:
    get:
      tags:
        - Collections
      summary: "Retrieve a collection by ID"
      description: "Return a collection resource by its identifier."
      parameters:
        - name: "collection_id"
          in: "path"
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
            example: 123
      responses:
        "400":
          description: "Invalid collection ID."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
              example:
                message: "collection_id must be a positive integer."
        "404":
          description: "Collection not found."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
              example:
                message: "Collection 123 not found."
        "403":
          description: "Access forbidden — not the owner."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
              example:
                message: "You do not have permission for this collection."
        "200":
          description: "Collection returned."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CardCollection"
              example:
                id: 123
                title: "Spanish Verbs"
                description: "Common verbs for beginners"
                known_language: "en"
                learning_language: "es"
                owner_id: 42
    put:
      tags:
        - Collections
      summary: "Update a collection"
      description: "Update a collection's metadata by ID."
      parameters:
        - name: "collection_id"
          in: "path"
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
            example: 123
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CardCollectionUpdateRequest"
            example:
              title: "Spanish Verbs - Updated"
              description: "Expanded set including irregular verbs"
              known_language: "en"
              learning_language: "es"
      responses:
        "200":
          description: "Updated collection returned."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CardCollection"
              example:
                id: 123
                title: "Spanish Verbs - Updated"
                owner_id: 42
    delete:
      tags:
        - Collections
      summary: "Delete a collection"
      description: "Remove a collection by its ID."
      parameters:
        - name: "collection_id"
          in: "path"
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
            example: 123
      responses:
        "204":
          description: "Collection deleted."
  /v1/collections:
    get:
      tags:
        - Collections
      summary: "List collections"
      description: "Return collections filtered by card or owner; supports pagination."
      parameters:
        - name: "card_id"
          in: "query"
          required: false
          schema:
            type: integer
            format: int64
            minimum: 1
            example: 321
        - name: "limit"
          in: "query"
          required: false
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 100
            example: 20
        - name: "offset"
          in: "query"
          required: false
          schema:
            type: integer
            format: int32
            minimum: 0
            example: 0
      responses:
        "200":
          description: "Paged list of collections."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CollectionsResponse"
              example:
                total_count: 1
                collections:
                  - id: 123
                    title: "Spanish Verbs"
                    owner_id: 42
    post:
      tags:
        - Collections
      summary: "Create a collection"
      description: "Insert a new collection for the authenticated user."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CardCollectionInsertRequest"
            example:
              title: "French Basics"
              description: "Beginner phrases and words"
              known_language: "en"
              learning_language: "fr"
      responses:
        "201":
          description: "Collection created."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CardCollection"
              example:
                id: 124
                title: "French Basics"
                owner_id: 42
  /v1/cards/{card_id}:
    get:
      tags:
        - Cards
      summary: "Retrieve a card"
      description: "Return a flashcard by its ID."
      parameters:
        - name: "card_id"
          in: "path"
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
            example: 555
      responses:
        "200":
          description: "Card returned."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Card"
              example:
                id: 555
                known_language_text: "dog"
                learning_language_text: "perro"
                notes: "noun"
                last_answered_at: "2025-01-01T12:00:00Z"
                show_next_time_at: "2025-01-02T12:00:00Z"
                correct_answers_in_row: 3
                owner_id: 42
    put:
      tags:
        - Cards
      summary: "Update a card"
      description: "Update a card's fields by ID."
      parameters:
        - name: "card_id"
          in: "path"
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
            example: 555
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CardUpdateRequest"
            example:
              known_language_text: "dog"
              learning_language_text: "perro"
              notes: "noun - common"
              correct_answers_in_row: 4
      responses:
        "200":
          description: "Updated card returned."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Card"
              example:
                id: 555
                known_language_text: "dog"
                learning_language_text: "perro"
                correct_answers_in_row: 4
                owner_id: 42
    delete:
      tags:
        - Cards
      summary: "Delete a card"
      description: "Remove a card by its ID."
      parameters:
        - name: "card_id"
          in: "path"
          required: true
          schema:
            type: "number"
      responses:
        "204":
          description: "Card deleted."
  /v1/cards:
    get:
      tags:
        - Cards
      summary: "List cards"
      description: "Return cards filtered by collection or owner; supports scheduling filter and pagination."
      parameters:
        - name: "collection_id"
          in: "query"
          required: false
          schema:
            type: integer
            format: int64
            minimum: 1
            example: 123
        - name: "next_time_before"
          in: "query"
          required: false
          schema:
            type: string
            format: date-time
            example: "2025-01-02T00:00:00Z"
        - name: "limit"
          in: "query"
          required: false
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 500
            example: 50
        - name: "offset"
          in: "query"
          required: false
          schema:
            type: integer
            format: int32
            minimum: 0
            example: 0
      responses:
        "200":
          description: "Paged list of cards."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CardsResponse"
              example:
                total_count: 1
                cards:
                  - id: 555
                    known_language_text: "cat"
                    learning_language_text: "gato"
                    notes: "noun"
                    correct_answers_in_row: 2
                    owner_id: 42
    post:
      tags:
        - Cards
      summary: "Create a card"
      description: "Insert a new card."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CardInsertRequest"
            example:
              known_language_text: "apple"
              learning_language_text: "manzana"
              notes: "fruit"
              correct_answers_in_row: 0
      responses:
        "201":
          description: "Card created."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Card"
              example:
                id: 556
                known_language_text: "apple"
                learning_language_text: "manzana"
                correct_answers_in_row: 0
                owner_id: 42
  /v1/collections/{collection_id}/cards/{card_id}:
    post:
      tags:
        - Collections-Cards
      summary: "Add card to collection"
      description: "Associate a card with a collection by their IDs."
      parameters:
        - name: "collection_id"
          in: "path"
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
            example: 123
        - name: "card_id"
          in: "path"
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
            example: 555
      responses:
        "201":
          description: "Card added to collection."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Card"
              example:
                id: 555
                known_language_text: "dog"
                learning_language_text: "perro"
                owner_id: 42
    delete:
      tags:
        - Collections-Cards
      summary: "Remove card from collection"
      description: "Dissociate a card from a collection by IDs."
      parameters:
        - name: "collection_id"
          in: "path"
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
            example: 123
        - name: "card_id"
          in: "path"
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
            example: 555
      responses:
        "204":
          description: "Card removed from collection."
  /v1/examples/{example_id}:
    get:
      tags:
        - Examples
      summary: "Get an example"
      description: "Retrieve an example (usage sentence) by its ID."
      parameters:
        - name: "example_id"
          in: "path"
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
            example: 987
      responses:
        "200":
          description: "Example returned."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Example"
              example:
                id: 987
                known_language_text: "I have a dog."
                learning_language_text: "Tengo un perro."
                card_id: 555
    put:
      tags:
        - Examples
      summary: "Update an example"
      description: "Update example text or associated card ID."
      parameters:
        - name: "example_id"
          in: "path"
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
            example: 987
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExampleUpdateRequest"
            example:
              known_language_text: "I have a dog."
              learning_language_text: "Tengo un perro."
              card_id: 555
      responses:
        "200":
          description: "Example updated."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Example"
              example:
                id: 987
                known_language_text: "I have a dog."
                learning_language_text: "Tengo un perro."
                card_id: 555
    delete:
      tags:
        - Examples
      summary: "Delete an example"
      description: "Remove an example by ID."
      parameters:
        - name: "example_id"
          in: "path"
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
            example: 987
      responses:
        "204":
          description: "Example deleted."
  /v1/cards/{card_id}/examples:
    get:
      tags:
        - Examples
      summary: "List examples for a card"
      description: "Return all usage examples associated with a card."
      parameters:
        - name: "card_id"
          in: "path"
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
            example: 555
      responses:
        "200":
          description: "Array of examples."
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Example"
              example:
                - id: 987
                  known_language_text: "I have a dog."
                  learning_language_text: "Tengo un perro."
                  card_id: 555
    post:
      tags:
        - Examples
      summary: "Create an example for a card"
      description: "Insert a new usage example that belongs to a card."
      parameters:
        - name: "card_id"
          in: "path"
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
            example: 555
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExampleInsertRequest"
            example:
              known_language_text: "She eats an apple."
              learning_language_text: "Ella come una manzana."
      responses:
        "201":
          description: "Example created."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Example"
              example:
                id: 988
                known_language_text: "She eats an apple."
                learning_language_text: "Ella come una manzana."
                card_id: 555
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    cookieAuth:
      type: apiKey
      in: cookie
      name: session
  schemas:
    Message:
      type: object
      properties:
        message:
          type: string
          minLength: 1
          example: "Operation completed successfully."
      required:
        - message
    Token:
      type: object
      properties:
        token:
          type: string
      required:
        - token
      example:
        token: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJhdWQiOiIvdjEiLCJpc3MiOiIvdjEvdG9rZW4iLCJzdHJvbmciOiJmYWxzZSIsImlhdCI6MTc1MDU0MDE4NH0.fwPG0GsqTVsiL4I9-zu8rC528mQf3tvVqQTXFgpN9Iw"
    RegistrationCredentials:
      type: object
      properties:
        username:
          type: string
          format: email
          minLength: 5
          maxLength: 254
          example: "alice@example.com"
        display_name:
          type: string
          minLength: 1
          maxLength: 100
          example: "Alice"
        password:
          type: string
          minLength: 8
          maxLength: 128
          example: "Str0ngP@ssw0rd"
      required:
        - username
        - display_name
        - password
    LoginCredentials:
      type: object
      properties:
        username:
          type: string
          format: email
          example: "alice@example.com"
        password:
          type: string
          example: "Str0ngP@ssw0rd"
      required:
        - username
        - password
    Account:
      type: object
      properties:
        id:
          type: integer
          format: int64
          nullable: true
          example: 42
        display_name:
          type: string
          example: "Alice"
        username:
          type: string
          format: email
          example: "alice@example.com"
      required:
        - display_name
        - username
    CardBase:
      type: object
      properties:
        known_language_text:
          type: string
          minLength: 1
          maxLength: 500
          example: "dog"
        learning_language_text:
          type: string
          minLength: 1
          maxLength: 500
          example: "perro"
        notes:
          type: string
          maxLength: 2000
          example: "noun"
        last_answered_at:
          type: string
          format: date-time
          nullable: true
          example: "2025-01-01T12:00:00Z"
        show_next_time_at:
          type: string
          format: date-time
          nullable: true
          example: "2025-01-02T12:00:00Z"
        correct_answers_in_row:
          type: integer
          format: int32
          minimum: 0
          example: 3
      required:
        - known_language_text
        - learning_language_text
        - notes
        - correct_answers_in_row
    Card:
      allOf:
        - $ref: "#/components/schemas/CardBase"
        - type: object
          properties:
            id:
              type: integer
              format: int64
              nullable: true
              example: 555
            owner_id:
              type: integer
              format: int64
              example: 42
          required:
            - owner_id
    CardsResponse:
      type: object
      properties:
        total_count:
          type: integer
          format: int64
          example: 1
        cards:
          type: array
          items:
            $ref: "#/components/schemas/Card"
      required:
        - total_count
        - cards
    CardInsertRequest:
      $ref: "#/components/schemas/CardBase"
    CardUpdateRequest:
      $ref: "#/components/schemas/CardBase"
    ExampleBase:
      type: object
      properties:
        known_language_text:
          type: string
          minLength: 1
          maxLength: 1000
          example: "I have a dog."
        learning_language_text:
          type: string
          minLength: 1
          maxLength: 1000
          example: "Tengo un perro."
      required:
        - known_language_text
        - learning_language_text
    Example:
      allOf:
        - $ref: "#/components/schemas/ExampleBase"
        - type: object
          properties:
            id:
              type: integer
              format: int64
              nullable: true
              example: 987
            card_id:
              type: integer
              format: int64
              example: 555
          required:
            - card_id
    ExampleInsertRequest:
      $ref: "#/components/schemas/ExampleBase"
    ExampleUpdateRequest:
      allOf:
        - $ref: "#/components/schemas/ExampleBase"
        - type: object
          properties:
            card_id:
              type: integer
              format: int64
              minimum: 1
              example: 555
          required:
            - card_id
    CardCollection:
      type: object
      properties:
        id:
          type: integer
          format: int64
          nullable: true
          example: 123
        title:
          type: string
          minLength: 1
          maxLength: 200
          example: "Spanish Verbs"
        description:
          type: string
          nullable: true
          maxLength: 2000
          example: "Common verbs for beginners"
        known_language:
          type: string
          nullable: true
          maxLength: 10
          example: "en"
        learning_language:
          type: string
          nullable: true
          maxLength: 10
          example: "es"
        owner_id:
          type: integer
          format: int64
          example: 42
      required:
        - title
        - owner_id
    CollectionsResponse:
      type: object
      properties:
        total_count:
          type: integer
          format: int64
          example: 1
        collections:
          type: array
          items:
            $ref: "#/components/schemas/CardCollection"
      required:
        - total_count
        - collections
    CardCollectionInsertRequest:
      type: object
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
          example: "French Basics"
        description:
          type: string
          nullable: true
          maxLength: 2000
          example: "Beginner phrases and words"
        known_language:
          type: string
          nullable: true
          maxLength: 10
          example: "en"
        learning_language:
          type: string
          nullable: true
          maxLength: 10
          example: "fr"
      required:
        - title
    CardCollectionUpdateRequest:
      $ref: "#/components/schemas/CardCollectionInsertRequest"
security:
  - bearerAuth: []
  - cookieAuth: []