openapi: "3.1.1"
info:
  title: "📑 Papagei API specification"
  description: "Public API for Papagei — spaced-repetition flashcards for language learning."
  version: "1.0.0"
tags:
  - name: Token
    description: "Generate and refresh JWT access tokens."
  - name: Account
    description: "User registration, authentication, session management, and profile."
  - name: Collections
    description: "Create, retrieve, update, and delete flashcard collections."
  - name: Cards
    description: "Full CRUD operations for flashcards, including WebSocket-based spaced repetition."
  - name: Collections-Cards
    description: "Add/remove cards to/from collections."
  - name: Examples
    description: "Create, retrieve, update, and delete usage examples for cards."
paths:
  /v1/token:
    get:
      tags:
        - Token
      summary: "Issue a new non-strong JWT token"
      description: |-
        Generate a new non-strong JWT access token. A strong token is required to access this endpoint.
        Optionally includes user ID claim if a valid session exists.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: "JWT token generated successfully."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Token"
              example:
                token: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJhdWQiOiIvdjEiLCJpc3MiOiIvdjEvdG9rZW4iLCJzdHJvbmciOmZhbHNlfQ.abc123"
        "401":
          description: "Provided token is invalid, expired, or not strong."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
              example:
                message: "The passed token is not valid or has expired."
  /v1/account/register:
    post:
      tags:
        - Account
      summary: "Create a new user account"
      description: "Register a new user with username, display name, and password. Not strong token required."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegistrationCredentials"
            example:
              username: "alice@example.com"
              display_name: "Alice"
              password: "SecurePass123!"
      responses:
        "201":
          description: "Account created successfully."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
              example:
                message: "The account was created successfully."
        "400":
          description: "Invalid request body format."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
              example:
                message: "The request body cannot be converted to a registration credentials."
        "401":
          description: |-
            Registration failed due to:
            - Username already taken
            - Username, display name, or password is blank
            - Invalid token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
              examples:
                usernameTaken:
                  value:
                    message: "The username \"alice@example.com\" is already taken."
                blankField:
                  value:
                    message: "The username cannot be blank."
  /v1/account/login:
    post:
      tags:
        - Account
      summary: "Authenticate user and create session"
      description: |-
        Authenticate with username and password. 
        Returns session cookie in `Set-Cookie` header on success.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginCredentials"
            example:
              username: "alice@example.com"
              password: "SecurePass123!"
      responses:
        "200":
          description: "Login successful — session established."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
              example:
                message: "Login was successful."
          headers:
            Set-Cookie:
              schema:
                type: string
              example: "session=abc123def456; Max-Age=300000000; Path=/; Secure; HttpOnly"
        "400":
          description: "Invalid request body format."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
              example:
                message: "The request body cannot be converted to a login credentials."
        "401":
          description: "Authentication failed — incorrect password."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
              example:
                message: "The password is incorrect."
        "404":
          description: "User not found."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
              example:
                message: "There is no the user with the \"alice@example.com\" username."
  /v1/account/logout:
    post:
      tags:
        - Account
      summary: "Terminate user session"
      description: "Invalidate the current session. Requires valid session cookie."
      security:
        - cookieAuth: []
      responses:
        "200":
          description: "Logout successful — session terminated."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
              example:
                message: "The user session was successfully deleted."
  /v1/account:
    get:
      tags:
        - Account
      summary: "Retrieve authenticated user's profile"
      description: "Get the account details of the currently authenticated user."
      security:
        - cookieAuth: []
      responses:
        "200":
          description: "User account information retrieved."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
              example:
                id: 42
                display_name: "Alice"
                username: "alice@example.com"
        "401":
          description: "Session invalid or user not found."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
              example:
                message: "The user with the corresponding session does not exist."
    delete:
      tags:
        - Account
      summary: "Delete authenticated user's account"
      description: "Permanently remove the account and all associated data. Requires strong token authentication."
      security:
        - bearerAuth: []
      responses:
        "204":
          description: "Account deleted successfully."
        "401":
          description: "Token is invalid, expired, or not strong."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
  /v1/collections:
    get:
      tags:
        - Collections
      summary: "List user's collections"
      description: |-
        Retrieve collections owned by the authenticated user, optionally filtered by card membership.
        Supports pagination via limit and offset.
      security:
        - cookieAuth: []
      parameters:
        - name: "card_id"
          in: "query"
          required: false
          description: "Filter collections containing this card ID."
          schema:
            type: integer
            format: int64
            minimum: 1
            example: 321
        - name: "limit"
          in: "query"
          required: false
          description: "Maximum number of results."
          schema:
            type: integer
            format: int32
            minimum: 0
            example: 20
        - name: "offset"
          in: "query"
          required: false
          description: "Number of results to skip."
          schema:
            type: integer
            format: int64
            minimum: 0
            example: 0
      responses:
        "200":
          description: "Paginated list of collections."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CollectionsResponse"
              example:
                total_count: 1
                collections:
                  - id: 123
                    title: "Spanish Verbs"
                    description: "Common verbs for beginners"
                    known_language: "en"
                    learning_language: "es"
                    owner_id: 42
        "400":
          description: "Invalid query parameter."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
              examples:
                invalidCardId:
                  value:
                    message: "The passed query parameter \"card_id\" must be a positive integer."
                invalidLimit:
                  value:
                    message: "The passed query parameter \"limit\" must be an integer greater than or equal to 0."
        "403":
          description: "Attempting to access another user's card."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
              example:
                message: "You cannot access someone else's card."
        "404":
          description: "Card or collection not found."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
              example:
                message: "There is no card with \"id\" property equal to \"321\"."
    post:
      tags:
        - Collections
      summary: "Create a new collection"
      description: "Create a new flashcard collection for the authenticated user."
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CardCollectionInsertRequest"
            example:
              title: "French Basics"
              description: "Beginner phrases and vocabulary"
              known_language: "en"
              learning_language: "fr"
      responses:
        "201":
          description: "Collection created successfully."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CardCollection"
              example:
                id: 124
                title: "French Basics"
                description: "Beginner phrases and vocabulary"
                known_language: "en"
                learning_language: "fr"
                owner_id: 42
        "400":
          description: "Invalid request body."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
              example:
                message: "The request body cannot be converted to a collection."
  /v1/collections/{collection_id}:
    get:
      tags:
        - Collections
      summary: "Retrieve a collection by ID"
      description: "Get a single collection by its ID. User must be the owner."
      security:
        - cookieAuth: []
      parameters:
        - name: "collection_id"
          in: "path"
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
            example: 123
      responses:
        "200":
          description: "Collection retrieved."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CardCollection"
              example:
                id: 123
                title: "Spanish Verbs"
                description: "Common verbs for beginners"
                known_language: "en"
                learning_language: "es"
                owner_id: 42
        "400":
          description: "Invalid collection ID."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
              example:
                message: "The \"collection_id\" parameter must be a positive integer."
        "403":
          description: "Collection owned by another user."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
              example:
                message: "You cannot access someone else's collection."
        "404":
          description: "Collection not found."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
              example:
                message: "There is no collection with \"id\" property equal to \"123\"."
    put:
      tags:
        - Collections
      summary: "Update a collection"
      description: "Modify collection metadata. User must be the owner."
      security:
        - cookieAuth: []
      parameters:
        - name: "collection_id"
          in: "path"
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
            example: 123
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CardCollectionUpdateRequest"
            example:
              title: "Spanish Verbs - Advanced"
              description: "Expanded set including irregular verbs"
              known_language: "en"
              learning_language: "es"
      responses:
        "200":
          description: "Collection updated."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CardCollection"
              example:
                id: 123
                title: "Spanish Verbs - Advanced"
                description: "Expanded set including irregular verbs"
                owner_id: 42
        "400":
          description: "Invalid collection ID or request body."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
              examples:
                invalidId:
                  value:
                    message: "The \"collection_id\" parameter must be a positive integer."
                invalidBody:
                  value:
                    message: "The request body cannot be converted to a collection."
        "403":
          description: "Collection owned by another user."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
              example:
                message: "You cannot access someone else's collection."
        "404":
          description: "Collection not found."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
              example:
                message: "There is no collection with \"id\" property equal to \"123\"."
    delete:
      tags:
        - Collections
      summary: "Delete a collection"
      description: "Permanently remove a collection. User must be the owner."
      security:
        - cookieAuth: []
      parameters:
        - name: "collection_id"
          in: "path"
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
            example: 123
      responses:
        "204":
          description: "Collection deleted."
        "400":
          description: "Invalid collection ID."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
              example:
                message: "The \"collection_id\" parameter must be a positive integer."
        "403":
          description: "Collection owned by another user."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
              example:
                message: "You cannot access someone else's collection."
        "404":
          description: "Collection not found."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
              example:
                message: "There is no collection with \"id\" property equal to \"123\"."
  /v1/cards:
    get:
      tags:
        - Cards
      summary: "List user's cards"
      description: |-
        Retrieve cards owned by the authenticated user, optionally filtered by collection.
        Supports scheduling filters, sorting, and pagination.
      security:
        - cookieAuth: []
      parameters:
        - name: "collection_id"
          in: "query"
          required: false
          description: "Filter cards belonging to this collection."
          schema:
            type: integer
            format: int64
            minimum: 1
            example: 123
        - name: "sort"
          in: "query"
          required: false
          description: |-
            Comma-separated sorting fields. Use `-` for descending, `+` for ascending.
            Supported fields: id, known_language_text, learning_language_text, notes, 
            last_answered_at, show_next_time_at, correct_answers_in_row, owner_id.
          schema:
            type: string
            example: "-show_next_time_at,+known_language_text"
        - name: "next_time_before"
          in: "query"
          required: false
          description: "Filter cards scheduled before this ISO 8601 timestamp."
          schema:
            type: string
            format: date-time
            example: "2025-01-02T00:00:00Z"
        - name: "limit"
          in: "query"
          required: false
          description: "Maximum number of results (0-500)."
          schema:
            type: integer
            format: int32
            minimum: 0
            maximum: 500
            example: 50
        - name: "offset"
          in: "query"
          required: false
          description: "Number of results to skip."
          schema:
            type: integer
            format: int64
            minimum: 0
            example: 0
      responses:
        "200":
          description: "Paginated list of cards."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CardsResponse"
              example:
                total_count: 2
                cards:
                  - id: 555
                    known_language_text: "cat"
                    learning_language_text: "gato"
                    notes: "noun"
                    correct_answers_in_row: 2
                    owner_id: 42
        "400":
          description: "Invalid query parameter."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
              examples:
                invalidCollection:
                  value:
                    message: "The passed query parameter \"collection_id\" must be a positive integer."
                invalidSort:
                  value:
                    message: "The passed query parameter \"sort\" is invalid."
                invalidTime:
                  value:
                    message: "The value \"invalid\" passed to the \"next_time_before\" query parameter is invalid."
        "403":
          description: "Attempting to access another user's collection."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
              example:
                message: "You cannot access someone else's collection."
        "404":
          description: "Collection not found."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
              example:
                message: "There is no collection with \"id\" property equal to \"123\"."
    post:
      tags:
        - Cards
      summary: "Create a new card"
      description: "Create a new flashcard for the authenticated user."
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CardInsertRequest"
            example:
              known_language_text: "apple"
              learning_language_text: "manzana"
              notes: "fruit"
              last_answered_at: null
              show_next_time_at: null
              correct_answers_in_row: 0
      responses:
        "201":
          description: "Card created."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Card"
              example:
                id: 556
                known_language_text: "apple"
                learning_language_text: "manzana"
                notes: "fruit"
                correct_answers_in_row: 0
                owner_id: 42
        "400":
          description: "Invalid request body."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
              example:
                message: "The request body cannot be converted to a card."
  /v1/cards/{card_id}:
    get:
      tags:
        - Cards
      summary: "Retrieve a card by ID"
      description: "Get a single card by its ID. User must be the owner."
      security:
        - cookieAuth: []
      parameters:
        - name: "card_id"
          in: "path"
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
            example: 555
      responses:
        "200":
          description: "Card retrieved."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Card"
              example:
                id: 555
                known_language_text: "dog"
                learning_language_text: "perro"
                notes: "noun"
                last_answered_at: "2025-01-01T12:00:00Z"
                show_next_time_at: "2025-01-02T12:00:00Z"
                correct_answers_in_row: 3
                owner_id: 42
        "400":
          description: "Invalid card ID."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
              example:
                message: "The \"card_id\" parameter must be a positive integer."
        "403":
          description: "Card owned by another user."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
              example:
                message: "You cannot access someone else's card."
        "404":
          description: "Card not found."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
              example:
                message: "There is no card with \"id\" property equal to \"555\"."
    put:
      tags:
        - Cards
      summary: "Update a card"
      description: "Modify a card's content. User must be the owner."
      security:
        - cookieAuth: []
      parameters:
        - name: "card_id"
          in: "path"
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
            example: 555
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CardUpdateRequest"
            example:
              known_language_text: "dog"
              learning_language_text: "perro"
              notes: "noun - common"
              correct_answers_in_row: 4
      responses:
        "200":
          description: "Card updated."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Card"
              example:
                id: 555
                known_language_text: "dog"
                learning_language_text: "perro"
                notes: "noun - common"
                correct_answers_in_row: 4
                owner_id: 42
        "400":
          description: "Invalid card ID or request body."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
              examples:
                invalidId:
                  value:
                    message: "The \"card_id\" parameter must be a positive integer."
                invalidBody:
                  value:
                    message: "The request body cannot be converted to a card."
        "403":
          description: "Card owned by another user."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
              example:
                message: "You cannot access someone else's card."
        "404":
          description: "Card not found."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
              example:
                message: "There is no card with \"id\" property equal to \"555\"."
    delete:
      tags:
        - Cards
      summary: "Delete a card"
      description: "Permanently remove a card. User must be the owner."
      security:
        - cookieAuth: []
      parameters:
        - name: "card_id"
          in: "path"
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
            example: 555
      responses:
        "204":
          description: "Card deleted."
        "400":
          description: "Invalid card ID."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
              example:
                message: "The \"card_id\" parameter must be a positive integer."
        "403":
          description: "Card owned by another user."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
              example:
                message: "You cannot access someone else's card."
        "404":
          description: "Card not found."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
              example:
                message: "There is no card with \"id\" property equal to \"555\"."
  /v1/cards/ws:
    get:
      tags:
        - Cards
      summary: "WebSocket: Interactive spaced repetition"
      description: |-
        WebSocket endpoint for real-time spaced repetition practice.
        
        **Connection Flow:**
        1. Client connects with valid session
        2. Server sends array of cards ready for review
        3. Client responds with difficulty level for card
        4. Server updates card statistics and sends next batch
        5. Connection closes when no cards are due
        
        **Request Format:**
        ```json
        {"difficulty_level": "EASY"|"MEDIUM"|"HARD"}
        ```
        
        **Response Format:**
        ```json
        [
          {
            "id": 555,
            "known_language_text": "dog",
            "learning_language_text": "perro",
            "notes": "noun",
            "show_next_time_at": "2025-01-02T12:00:00Z",
            "correct_answers_in_row": 3,
            "owner_id": 42
          }
        ]
        ```
      security:
        - cookieAuth: []
      responses:
        "101":
          description: "WebSocket connection established."
        "401":
          description: "Invalid or missing session cookie."
  /v1/collections/{collection_id}/cards/{card_id}:
    post:
      tags:
        - Collections-Cards
      summary: "Add card to collection"
      description: "Associate a card with a collection. Both must be owned by authenticated user."
      security:
        - cookieAuth: []
      parameters:
        - name: "collection_id"
          in: "path"
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
            example: 123
        - name: "card_id"
          in: "path"
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
            example: 555
      responses:
        "201":
          description: "Card added to collection."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Card"
              example:
                id: 555
                known_language_text: "dog"
                learning_language_text: "perro"
                owner_id: 42
        "400":
          description: "Invalid collection or card ID."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
              examples:
                invalidCollectionId:
                  value:
                    message: "The \"collection_id\" parameter must be a positive integer."
                invalidCardId:
                  value:
                    message: "The \"card_id\" parameter must be a positive integer."
        "403":
          description: "Collection or card owned by another user."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
              example:
                message: "You cannot access someone else's collection."
        "404":
          description: "Collection or card not found."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
              example:
                message: "There is no collection with \"id\" property equal to \"123\"."
    delete:
      tags:
        - Collections-Cards
      summary: "Remove card from collection"
      description: "Dissociate a card from a collection. Both must be owned by authenticated user."
      security:
        - cookieAuth: []
      parameters:
        - name: "collection_id"
          in: "path"
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
            example: 123
        - name: "card_id"
          in: "path"
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
            example: 555
      responses:
        "204":
          description: "Card removed from collection."
        "400":
          description: "Invalid collection or card ID."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
        "403":
          description: "Collection or card owned by another user."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
              example:
                message: "You cannot access someone else's collection."
        "404":
          description: "Collection or card not found."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
  /v1/cards/{card_id}/examples:
    get:
      tags:
        - Examples
      summary: "List examples for a card"
      description: "Retrieve all usage examples for a card. User must own the card."
      security:
        - cookieAuth: []
      parameters:
        - name: "card_id"
          in: "path"
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
            example: 555
      responses:
        "200":
          description: "Array of examples."
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Example"
              example:
                - id: 987
                  known_language_text: "I have a dog."
                  learning_language_text: "Tengo un perro."
                  card_id: 555
        "400":
          description: "Invalid card ID."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
              example:
                message: "The \"card_id\" parameter is not passed or cannot be cast to number."
        "403":
          description: "Card owned by another user."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
              example:
                message: "You cannot access someone else's example."
        "404":
          description: "Card not found."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
              example:
                message: "There is no card with \"id\" property equal to \"555\"."
    post:
      tags:
        - Examples
      summary: "Create example for a card"
      description: "Insert a new usage example. Card must be owned by authenticated user."
      security:
        - cookieAuth: []
      parameters:
        - name: "card_id"
          in: "path"
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
            example: 555
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExampleInsertRequest"
            example:
              known_language_text: "She eats an apple."
              learning_language_text: "Ella come una manzana."
      responses:
        "201":
          description: "Example created."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Example"
              example:
                id: 988
                known_language_text: "She eats an apple."
                learning_language_text: "Ella come una manzana."
                card_id: 555
        "400":
          description: "Invalid card ID or request body."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
              examples:
                invalidCardId:
                  value:
                    message: "The \"card_id\" parameter must be a positive integer."
                invalidBody:
                  value:
                    message: "The request body cannot be converted to an example."
        "403":
          description: "Card owned by another user."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
              example:
                message: "You cannot access someone else's example."
        "404":
          description: "Card not found."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
              example:
                message: "There is no card with \"id\" property equal to \"555\"."
  /v1/examples/{example_id}:
    get:
      tags:
        - Examples
      summary: "Retrieve an example by ID"
      description: "Get a single example. User must own the parent card."
      security:
        - cookieAuth: []
      parameters:
        - name: "example_id"
          in: "path"
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
            example: 987
      responses:
        "200":
          description: "Example retrieved."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Example"
              example:
                id: 987
                known_language_text: "I have a dog."
                learning_language_text: "Tengo un perro."
                card_id: 555
        "400":
          description: "Invalid example ID."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
              example:
                message: "The \"example_id\" parameter must be a positive integer."
        "403":
          description: "Parent card owned by another user."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
              example:
                message: "You cannot access someone else's example."
        "404":
          description: "Example not found."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
              example:
                message: "There is no example with \"id\" property equal to \"987\"."
    put:
      tags:
        - Examples
      summary: "Update an example"
      description: "Modify example text or associated card. User must own both examples' parent card and new parent card (if different)."
      security:
        - cookieAuth: []
      parameters:
        - name: "example_id"
          in: "path"
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
            example: 987
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExampleUpdateRequest"
            example:
              known_language_text: "I have a big dog."
              learning_language_text: "Tengo un perro grande."
              card_id: 555
      responses:
        "200":
          description: "Example updated."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Example"
              example:
                id: 987
                known_language_text: "I have a big dog."
                learning_language_text: "Tengo un perro grande."
                card_id: 555
        "400":
          description: "Invalid example ID or request body."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
              examples:
                invalidId:
                  value:
                    message: "The \"example_id\" parameter must be a positive integer."
                invalidBody:
                  value:
                    message: "The request body cannot be converted to an example."
        "403":
          description: "Parent card owned by another user."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
              example:
                message: "You cannot access someone else's example."
        "404":
          description: "Example or card not found."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
              examples:
                exampleNotFound:
                  value:
                    message: "There is no example with \"id\" property equal to \"987\"."
                cardNotFound:
                  value:
                    message: "There is no card with \"id\" property equal to passed \"556\"."
    delete:
      tags:
        - Examples
      summary: "Delete an example"
      description: "Permanently remove an example. User must own the parent card."
      security:
        - cookieAuth: []
      parameters:
        - name: "example_id"
          in: "path"
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
            example: 987
      responses:
        "204":
          description: "Example deleted."
        "400":
          description: "Invalid example ID."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
              example:
                message: "The \"example_id\" parameter must be a positive integer."
        "403":
          description: "Parent card owned by another user."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
              example:
                message: "You cannot access someone else's example."
        "404":
          description: "Example not found."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
              example:
                message: "There is no example with \"id\" property equal to \"987\"."
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: "JWT token with optional strong claim. Strong tokens can issue new tokens."
    cookieAuth:
      type: apiKey
      in: cookie
      name: session
      description: "Session cookie set after successful login."
  schemas:
    Message:
      type: object
      properties:
        message:
          type: string
          minLength: 1
      required:
        - message
      example:
        message: "Operation completed successfully."
    Token:
      type: object
      properties:
        token:
          type: string
      required:
        - token
      example:
        token: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJhdWQiOiIvdjEiLCJpc3MiOiIvdjEvdG9rZW4iLCJzdHJvbmciOmZhbHNlfQ.abc123"
    RegistrationCredentials:
      type: object
      properties:
        username:
          type: string
          format: email
          minLength: 5
          maxLength: 254
          example: "alice@example.com"
        display_name:
          type: string
          minLength: 1
          maxLength: 100
          example: "Alice"
        password:
          type: string
          minLength: 8
          maxLength: 128
          example: "SecurePass123!"
      required:
        - username
        - display_name
        - password
    LoginCredentials:
      type: object
      properties:
        username:
          type: string
          format: email
          minLength: 5
          maxLength: 254
          example: "alice@example.com"
        password:
          type: string
          minLength: 1
          example: "SecurePass123!"
      required:
        - username
        - password
    Account:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 42
        display_name:
          type: string
          maxLength: 100
          example: "Alice"
        username:
          type: string
          format: email
          example: "alice@example.com"
      required:
        - display_name
        - username
    CardBase:
      type: object
      properties:
        known_language_text:
          type: string
          minLength: 1
          maxLength: 500
          example: "dog"
        learning_language_text:
          type: string
          minLength: 1
          maxLength: 500
          example: "perro"
        notes:
          type: string
          maxLength: 2000
          nullable: true
          example: "noun"
        last_answered_at:
          type: string
          format: date-time
          nullable: true
          example: "2025-01-01T12:00:00Z"
        show_next_time_at:
          type: string
          format: date-time
          nullable: true
          example: "2025-01-02T12:00:00Z"
        correct_answers_in_row:
          type: integer
          format: int32
          minimum: 0
          example: 3
      required:
        - known_language_text
        - learning_language_text
        - notes
        - correct_answers_in_row
    Card:
      allOf:
        - $ref: "#/components/schemas/CardBase"
        - type: object
          properties:
            id:
              type: integer
              format: int64
              example: 555
            owner_id:
              type: integer
              format: int64
              example: 42
          required:
            - owner_id
    CardsResponse:
      type: object
      properties:
        total_count:
          type: integer
          format: int64
          example: 10
        cards:
          type: array
          items:
            $ref: "#/components/schemas/Card"
      required:
        - total_count
        - cards
    CardInsertRequest:
      $ref: "#/components/schemas/CardBase"
    CardUpdateRequest:
      $ref: "#/components/schemas/CardBase"
    ExampleBase:
      type: object
      properties:
        known_language_text:
          type: string
          minLength: 1
          maxLength: 1000
          example: "I have a dog."
        learning_language_text:
          type: string
          minLength: 1
          maxLength: 1000
          example: "Tengo un perro."
      required:
        - known_language_text
        - learning_language_text
    Example:
      allOf:
        - $ref: "#/components/schemas/ExampleBase"
        - type: object
          properties:
            id:
              type: integer
              format: int64
              example: 987
            card_id:
              type: integer
              format: int64
              example: 555
          required:
            - card_id
    ExampleInsertRequest:
      $ref: "#/components/schemas/ExampleBase"
    ExampleUpdateRequest:
      allOf:
        - $ref: "#/components/schemas/ExampleBase"
        - type: object
          properties:
            card_id:
              type: integer
              format: int64
              minimum: 1
              example: 555
          required:
            - card_id
    CardCollection:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 123
        title:
          type: string
          minLength: 1
          maxLength: 200
          example: "Spanish Verbs"
        description:
          type: string
          nullable: true
          maxLength: 2000
          example: "Common verbs for beginners"
        known_language:
          type: string
          nullable: true
          maxLength: 10
          example: "en"
        learning_language:
          type: string
          nullable: true
          maxLength: 10
          example: "es"
        owner_id:
          type: integer
          format: int64
          example: 42
      required:
        - title
        - owner_id
    CollectionsResponse:
      type: object
      properties:
        total_count:
          type: integer
          format: int64
          example: 5
        collections:
          type: array
          items:
            $ref: "#/components/schemas/CardCollection"
      required:
        - total_count
        - collections
    CardCollectionInsertRequest:
      type: object
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
          example: "French Basics"
        description:
          type: string
          nullable: true
          maxLength: 2000
          example: "Beginner phrases and vocabulary"
        known_language:
          type: string
          nullable: true
          maxLength: 10
          example: "en"
        learning_language:
          type: string
          nullable: true
          maxLength: 10
          example: "fr"
      required:
        - title
    CardCollectionUpdateRequest:
      $ref: "#/components/schemas/CardCollectionInsertRequest"
security:
  - bearerAuth: []
  - cookieAuth: []