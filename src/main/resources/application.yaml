ktor:
  application:
    modules:
      - com.yaroslavzghoba.ApplicationKt.module
  deployment:
    port: 8080

security:
  jwt:
    secret: $PPG_JWT_SECRET
    issuer: "/api/register"
    audience: "/api"
    realm: "Access to the API"
    lifetime-ms: 900000  # 15 min
  sessions:
    lifetime-ms: 900000  # 15 min
  hashing:
    pepper: $PPG_PEPPER
    algorithm: "SHA-512"
    salt-min-length: 32
    salt-max-length: 48

database:
  protocol: "jdbc:postgresql"
  host: $PPG_PROD_DB_HOST
  user: $PPG_PROD_DB_USER
  password: $PPG_PROD_DB_PASSWORD