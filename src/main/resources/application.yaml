ktor:
  application:
    modules:
      - com.yaroslavzghoba.ApplicationKt.module
  deployment:
    port: 8080

security:
  jwt:
    secret: $JWT_SECRET_OF_PAPAGEI
    issuer: "/api/register"
    audience: "/api"
    realm: "Access to the API"
    lifetime-ms: 900000  # 15 min
  sessions:
    lifetime-ms: 900000  # 15 min
  hashing:
    pepper: $PEPPERED_SECRET_OF_PAPAGEI
    algorithm: "SHA-512"
    salt-min-length: 32
    salt-max-length: 48

database:
  url-protocol: $DATABASE_URL_PROTOCOL
  url: $DATABASE_URL
  user: $USER_DATABASE_USERNAME
  password: $USER_DATABASE_PASSWORD