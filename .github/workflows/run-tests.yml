name: Run unit and integration tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  run-tests:
    runs-on: ubuntu-latest
    steps:
      # Run a container with the test database
      - name: Checkout the "papagei-service/database" repository
        uses: actions/checkout@v5
        with:
          repository: "papagei-service/database"
          ref: main

      - name: Build the Docker image
        run: docker build . --file Dockerfile --tag papagei-db

      - name: Run a container based on the image
        run: |
          docker run -d \
          --name papagei-test-db \
          -p 9002:5432 \
          -e POSTGRES_DB=${{ secrets.POSTGRES_DB }} \
          -e POSTGRES_USER=${{ secrets.POSTGRES_USER }} \
          -e POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }} \
          papagei-db

      - name: Check the container's status
        run: docker container ls -a

      # Build the project and run tests
      - name: Checkout the current repository
        uses: actions/checkout@v5

      - name: Set up Amazon Corretto 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "corretto"
          cache: "gradle"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build and test with Gradle
        env:
          PPG_TEST_DB_HOST_WITH_PATH: ${{ secrets.PPG_TEST_DB_HOST_WITH_PATH }}
          PPG_TEST_DB_USER: ${{ secrets.PPG_TEST_DB_USER }}
          PPG_TEST_DB_PASSWORD: ${{ secrets.PPG_TEST_DB_PASSWORD }}
        run: ./gradlew build --no-daemon