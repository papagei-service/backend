name: Run unit and integration tests

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

jobs:
  run-tests:
    runs-on: ubuntu-latest
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_ACCESS_TOKEN: ${{ secrets.DOCKERHUB_ACCESS_TOKEN }}
      DOCKERHUB_REPOSITORY: ${{ secrets.DOCKERHUB_REPOSITORY }}
      COVERAGE_REPORT_FILE: "./.coverage-report.txt"
      COVERAGE_CHECKER: ./.github/workflows/utils/check-coverage.sh
    steps:
      # START A TEST INSTANCE OF THE DATABASE
      - name: Log in to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_ACCESS_TOKEN }}

      - name: Pull the database image
        run: docker pull ${{ env.DOCKERHUB_USERNAME }}/${{ env.DOCKERHUB_REPOSITORY }}:latest

      - name: Run a container based on the image
        run: |
          docker run -d \
          --name papagei-test-db \
          -p 9002:5432 \
          -e POSTGRES_DB=${{ secrets.POSTGRES_DB }} \
          -e POSTGRES_USER=${{ secrets.POSTGRES_USER }} \
          -e POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }} \
          ${{ env.DOCKERHUB_USERNAME }}/${{ env.DOCKERHUB_REPOSITORY }}

      # RUN UNIT AND INTEGRATION TESTS
      - name: Checkout the current repository
        uses: actions/checkout@v5

      - name: Set up Amazon Corretto 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "corretto"
          cache: "gradle"

      - name: Run unit and integration tests
        env:
          PPG_TEST_DB_HOST_WITH_PATH: ${{ secrets.PPG_TEST_DB_HOST_WITH_PATH }}
          PPG_TEST_DB_USER: ${{ secrets.PPG_TEST_DB_USER }}
          PPG_TEST_DB_PASSWORD: ${{ secrets.PPG_TEST_DB_PASSWORD }}
        run: |
          chmod u+x ./gradlew
          ./gradlew :koverPrintCoverage --quiet >> ./${{ env.COVERAGE_REPORT_FILE }}

      - name: Check the coverage percent
        run: |
          chmod u+x ./${{ env.COVERAGE_CHECKER }}
          ./${{ env.COVERAGE_CHECKER }} ./${{ env.TESTING_OUTPUT_FILE }}